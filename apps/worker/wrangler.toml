name = "ezmon-evaluator"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]


[dev]
port = 8787

[triggers]
crons = ["* * * * *"]

[vars]
# Semua query database diproxy melalui Hub API, bukan koneksi TCP langsung.
# Set secrets via: npx wrangler secret put <KEY>

# [secrets]
# HUB_URL      - URL deployment Vercel (contoh: https://ezmon.vercel.app)
# WORKER_SECRET - shared secret untuk autentikasi ke Hub API (wajib)
# DATABASE_URL  - legacy, tidak digunakan langsung oleh Worker

[env.beta]
name = "ezmon-evaluator-beta"
# Schedule and other configs are inherited from the base configuration

[env.beta.vars]
# Variables for beta (empty for now, as we use secrets)
